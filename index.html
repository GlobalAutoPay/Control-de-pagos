<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yetta Services Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-zoom: 1;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8F9FA; 
            zoom: var(--app-zoom); 
            overscroll-behavior-y: none;
        }
        .custom-scrollbar {
            -webkit-overflow-scrolling: touch; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input::-webkit-calendar-picker-indicator { display: none !important; }
        
        .h-screen-mobile {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>
<body class="h-screen-mobile overflow-hidden flex flex-col lg:flex-row p-0 sm:p-4 md:p-6 gap-0 sm:gap-4 text-gray-800 selection:bg-red-100 selection:text-red-900">

    <div id="app-root" class="w-full h-full flex flex-col lg:flex-row gap-0 sm:gap-4 max-w-[1400px] mx-auto relative bg-[#F8F9FA] sm:bg-transparent">
        <!-- Reactivity Root -->
    </div>

    <script>
        const savedZoom = localStorage.getItem('yetta_zoom') || 1;
        document.documentElement.style.setProperty('--app-zoom', savedZoom);

        const getEmptyRows = () => Array(10).fill().map((_, i) => ({
            id: Date.now() + i, cant: 1, targetId: '', trabajo: '', precio: '', pagado: 'si', metodo: 'cop'
        }));

        const todayStr = new Date().toISOString().split('T')[0];

        const defaultState = {
            zoomLevel: savedZoom,
            activeTab: 'dashboard',
            activeDate: todayStr,
            showNextDayModal: false,
            showResetModal: false, 
            showWeeklyConfigModal: false,
            showRechargeModal: false,
            estimationPeriod: 'dia', 
            saveStatus: null, 
            resumenTab: 'todos', 
            tabOrder: ['dashboard', 'suppliers', 'memberships', 'users', 'tools', 'calculator', 'sales', 'settings'],

            weeklyCycle: {
                isConfigured: false,
                startDay: 1, 
                endDay: 0, 
                currentStartDate: todayStr
            },

            entityModal: { show: false, type: 'cliente', editingId: null },
            calcState: { displayBase: 'USDT', baseValue: '' },

            generatedPassword: '',
            passwordHistory: [],
            keySearchQuery: '',
            keySearchResult: null,
            isSearchingKey: false,
            keysStore: [
                { sn: "A5GGBB5916117838", key: "549E7CED79FAB4C0" },
                { sn: "AC3N6R4C11008453", key: "CF7LY96LZ315WL34FRP" },
                { sn: "A7RM6R5103003989", key: "DQE5TSJC5YFSHCMAFRP" },
                { sn: "ASXX6R5221001418", key: "318LXU0A5DNULN7AFRP" },
                { sn: "AF6RUT5626000482", key: "RD73G578DJVT9WZXFRP" }
            ],

            salesSearchQuery: '',
            salesData: {
                initialInvestment: 0,
                profitReinvested: 0,
                products: [],
                history: []
            },

            clients: [
                { id: 1, name: 'Juan Pérez', currency: 'cop', debt: 0, type: 'cliente' },
                { id: 2, name: 'María Gómez', currency: 'usdt', debt: 0, type: 'cliente' },
                { id: 3, name: 'Carlos Rodríguez', currency: 'mxn', debt: 0, type: 'cliente' }
            ],
            selectedClients: [], // Nuevo estado para selección múltiple
            suppliers: [
                { id: 1, name: 'Hosting AWS', currency: 'usdt', debt: 0, type: 'proveedor' }
            ],
            memberships: [],
            exchangeRates: { cop: 4000, mxn: 17, usdt: 1 },
            paymentSheets: { [todayStr]: getEmptyRows() },
            supplierSheets: { [todayStr]: getEmptyRows() }
        };

        let state = { ...defaultState };
        const LOCAL_DB_KEY = 'yetta_local_database';

        function loadLocalDatabase() {
            try {
                const savedData = localStorage.getItem(LOCAL_DB_KEY);
                if (savedData) {
                    const parsedData = JSON.parse(savedData);
                    state = { ...defaultState, ...parsedData };
                    
                    if (!state.weeklyCycle) state.weeklyCycle = { isConfigured: false, startDay: 1, endDay: 0, currentStartDate: todayStr };
                    if (!state.paymentSheets[todayStr]) state.paymentSheets[todayStr] = getEmptyRows();
                    if (!state.supplierSheets[todayStr]) state.supplierSheets[todayStr] = getEmptyRows();
                    if (!state.selectedClients) state.selectedClients = []; // Inicializar si no existe
                    if (!state.entityModal.editingId) state.entityModal.editingId = null;
                    
                    state.activeTab = 'dashboard';
                    state.activeDate = todayStr;
                    state.showNextDayModal = false;
                    state.showResetModal = false;
                    state.showWeeklyConfigModal = false;
                    state.saveStatus = null;
                }
            } catch (e) {
                console.error("Error al cargar la base de datos local:", e);
            }
        }

        function saveLocalDatabase() {
            try {
                localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Error al guardar en la base de datos local:", e);
            }
        }

        loadLocalDatabase();

        const App = {};

        App.checkResponsive = () => {
            const isMobile = window.innerWidth < 1024;
            if (isMobile) {
                document.documentElement.style.setProperty('--app-zoom', 1);
                document.body.classList.add('mobile-mode');
            } else {
                document.documentElement.style.setProperty('--app-zoom', state.zoomLevel);
                document.body.classList.remove('mobile-mode');
            }
        };

        window.addEventListener('resize', App.checkResponsive);

        let isRendering = false;
        function render() {
            if (isRendering) return;
            isRendering = true;
            
            saveLocalDatabase();

            requestAnimationFrame(() => {
                const activeElementId = document.activeElement ? document.activeElement.id : null;
                let selectionStart = null;
                let selectionEnd = null;

                if (activeElementId && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                    try {
                        selectionStart = document.activeElement.selectionStart;
                        selectionEnd = document.activeElement.selectionEnd;
                    } catch (e) {}
                }

                // SOLUCIÓN BUG: Capturar posición de scroll del contenedor principal antes de re-renderizar
                const scrollContainer = document.querySelector('main > div.flex-1.overflow-auto');
                const mainScrollTop = scrollContainer ? scrollContainer.scrollTop : 0;
                const mainScrollLeft = scrollContainer ? scrollContainer.scrollLeft : 0;

                document.getElementById('app-root').innerHTML = `
                    ${renderSidebar()}
                    <main class="flex-1 flex flex-col gap-4 w-full h-full overflow-hidden relative p-2 sm:p-0">
                        ${renderHeader()}
                        <div class="flex-1 overflow-auto w-full pb-20 lg:pb-0 custom-scrollbar pr-1 sm:pr-2">
                            ${renderContent()}
                        </div>
                    </main>
                    ${renderMobileNav()}
                    ${state.showNextDayModal ? renderNextDayModal() : ''}
                    ${state.entityModal.show ? renderEntityModal() : ''}
                    ${state.showResetModal ? renderResetModal() : ''}
                    ${state.showWeeklyConfigModal ? renderWeeklyConfigModal() : ''}
                    ${state.showRechargeModal ? renderRechargeModal() : ''}
                `;
                lucide.createIcons();

                // SOLUCIÓN BUG: Restaurar posición de scroll del contenedor principal
                const newScrollContainer = document.querySelector('main > div.flex-1.overflow-auto');
                if (newScrollContainer) {
                    newScrollContainer.scrollTop = mainScrollTop;
                    newScrollContainer.scrollLeft = mainScrollLeft;
                }

                if (activeElementId) {
                    const el = document.getElementById(activeElementId);
                    if (el) {
                        el.focus();
                        if (selectionStart !== null && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && el.type !== 'number') {
                            try { el.setSelectionRange(selectionStart, selectionEnd); } catch (e) {}
                        }
                    }
                }
                isRendering = false;
            });
        }

        App.setActiveTab = (tab) => { state.activeTab = tab; render(); };
        App.setEstimationPeriod = (period) => { state.estimationPeriod = period; render(); };
        
        App.setZoom = (val) => {
            localStorage.setItem('yetta_zoom', val);
            state.zoomLevel = val;
            App.checkResponsive(); 
            if(window.innerWidth >= 1024) render();
        };

        App.handleDragStart = (e, id) => { 
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData('text/plain', id); 
        };
        App.handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; };
        App.handleDrop = (e, targetId) => {
            e.preventDefault();
            const sourceId = e.dataTransfer.getData('text/plain');
            if (!sourceId || sourceId === targetId) return;
            const newOrder = [...state.tabOrder];
            const sourceIndex = newOrder.indexOf(sourceId);
            const targetIndex = newOrder.indexOf(targetId);
            if(sourceIndex !== -1 && targetIndex !== -1) {
                newOrder.splice(sourceIndex, 1);
                newOrder.splice(targetIndex, 0, sourceId);
                state.tabOrder = newOrder;
                render();
            }
        };

        App.formatCurrency = (value, currency = 'usdt') => {
            let val = parseFloat(value);
            if (isNaN(val)) val = 0;
            if (currency === 'cop') return new Intl.NumberFormat('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
        };

        App.parseInputValue = (val, currency) => {
            if (!val) return '';
            const clean = val.toString().replace(/[^\d.]/g, '');
            return currency === 'cop' ? clean.replace(/\./g, '') : clean;
        };

        App.formatInputValue = (val, currency) => {
            if (!val) return '';
            const clean = val.toString().replace(/[^\d.]/g, '');
            if (currency === 'cop') {
                const num = parseInt(clean.replace(/\./g, ''), 10);
                return isNaN(num) ? '' : num.toLocaleString('es-CO');
            }
            return clean;
        };

        App.changeDate = (days) => {
            const current = new Date(state.activeDate + 'T00:00:00');
            current.setDate(current.getDate() + days);
            state.activeDate = current.toISOString().split('T')[0];
            if(!state.paymentSheets[state.activeDate]) state.paymentSheets[state.activeDate] = getEmptyRows();
            if(!state.supplierSheets[state.activeDate]) state.supplierSheets[state.activeDate] = getEmptyRows();
            render();
        };

        App.addRow = (sheetType) => {
            const targetSheet = sheetType === 'payments' ? state.paymentSheets : state.supplierSheets;
            if(!targetSheet[state.activeDate]) targetSheet[state.activeDate] = [];
            targetSheet[state.activeDate].push({ id: Date.now(), cant: 1, targetId: '', trabajo: '', precio: '', pagado: 'si', metodo: 'cop' });
            render();
        };

        App.removeRow = (sheetType, index) => {
             const targetSheet = sheetType === 'payments' ? state.paymentSheets : state.supplierSheets;
             if(targetSheet[state.activeDate] && targetSheet[state.activeDate].length > 1) {
                  targetSheet[state.activeDate].splice(index, 1);
                  render();
             }
        };

        App.getGlobalDebt = (type = 'cliente') => {
            const totals = { cop: 0, usdt: 0, mxn: 0, totalConvertido: 0 };
            const sheets = type === 'cliente' ? state.paymentSheets : state.supplierSheets;
            
            Object.values(sheets).forEach(rows => {
                rows.forEach(row => {
                    const p = parseFloat(row.precio) || 0;
                    if(p > 0 && row.pagado === 'no' && row.targetId) {
                        const curr = row.metodo || 'cop';
                        if (totals[curr] !== undefined) {
                            totals[curr] += p;
                        }
                    }
                });
            });
            
            totals.totalConvertido = totals.usdt + (totals.cop / state.exchangeRates.cop) + (totals.mxn / state.exchangeRates.mxn);
            return totals;
        };

        App.getWeeklyStats = (sheetType = 'payments') => {
            const totals = { cop: 0, usdt: 0, mxn: 0 };
            const sheets = sheetType === 'payments' ? state.paymentSheets : state.supplierSheets;
            
            let startDate;
            if (state.weeklyCycle && state.weeklyCycle.isConfigured) {
                startDate = new Date(state.weeklyCycle.currentStartDate + 'T00:00:00');
            } else {
                const today = new Date(state.activeDate + 'T00:00:00');
                const dayOfWeek = today.getDay();
                const diffToMonday = today.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
                startDate = new Date(today);
                startDate.setDate(diffToMonday);
                startDate.setHours(0, 0, 0, 0);
            }

            Object.keys(sheets).forEach(dateStr => {
                const sheetDate = new Date(dateStr + 'T00:00:00');
                
                let isValidDate = false;
                if (state.weeklyCycle && state.weeklyCycle.isConfigured) {
                    isValidDate = sheetDate >= startDate; 
                } else {
                    const endOfWeek = new Date(startDate);
                    endOfWeek.setDate(startDate.getDate() + 6);
                    endOfWeek.setHours(23, 59, 59, 999);
                    isValidDate = sheetDate >= startDate && sheetDate <= endOfWeek;
                }

                if (isValidDate) {
                    sheets[dateStr].forEach(row => {
                        const precio = parseFloat(row.precio) || 0;
                        if (precio > 0 && row.pagado === 'si') totals[row.metodo || 'cop'] += precio;
                    });
                }
            });

            const totalUsdt = totals.usdt + (totals.cop / state.exchangeRates.cop) + (totals.mxn / state.exchangeRates.mxn);
            return { desglose: totals, totalConvertido: totalUsdt };
        };

        App.getCurrentStats = (sheetType = 'payments') => {
            const rows = (sheetType === 'payments' ? state.paymentSheets : state.supplierSheets)[state.activeDate] || [];
            const stats = { cobrados: { count: 0, cop: 0, usdt: 0, mxn: 0, total: 0 }, pendientes: { count: 0, cop: 0, usdt: 0, mxn: 0, total: 0 } };
            
            rows.forEach(row => {
                const precio = parseFloat(row.precio) || 0;
                const m = row.metodo || 'cop';
                if (precio > 0) {
                    const target = row.pagado === 'si' ? stats.cobrados : stats.pendientes;
                    target.count++;
                    target[m] += precio;
                }
            });

            stats.cobrados.total = stats.cobrados.usdt + (stats.cobrados.cop / state.exchangeRates.cop) + (stats.cobrados.mxn / state.exchangeRates.mxn);
            stats.pendientes.total = stats.pendientes.usdt + (stats.pendientes.cop / state.exchangeRates.cop) + (stats.pendientes.mxn / state.exchangeRates.mxn);
            return stats;
        };

        App.updateRow = (sheetType, index, field, value) => {
            const targetSheet = sheetType === 'payments' ? state.paymentSheets : state.supplierSheets;
            let currentRows = targetSheet[state.activeDate];
            
            if (field === 'metodo') currentRows[index][field] = value;
            else if (field === 'precio') {
                const curr = currentRows[index].metodo || 'cop';
                currentRows[index][field] = App.parseInputValue(value, curr);
            } 
            else if (field === 'cant') { // NUEVO: Manejo de actualización de cantidad
                currentRows[index][field] = parseInt(value) || 1;
            }
            else if (field === 'trabajo') {
                currentRows[index][field] = value;
                const matchedProduct = state.salesData.products.find(p => p.name.toLowerCase() === value.toLowerCase());
                if (matchedProduct && (!currentRows[index].precio || currentRows[index].precio === '0' || currentRows[index].precio === '')) {
                    currentRows[index].precio = sheetType === 'payments' ? matchedProduct.price.toString() : matchedProduct.cost.toString();
                }
            }
            else currentRows[index][field] = value;
            
            if (field === 'targetId' && value) {
                const list = sheetType === 'payments' ? state.clients : state.suppliers;
                const entity = list.find(e => e.id === parseInt(value));
                if (entity) currentRows[index].metodo = entity.currency;
            }
            render();
        };

        App.handleSaveAndCalculate = () => {
            state.saveStatus = 'saving';
            render();
            
            const newClientDebts = {};
            state.clients.forEach(c => newClientDebts[c.id] = 0);
            Object.values(state.paymentSheets).forEach(rows => {
                rows.forEach(row => {
                    if (row.targetId && row.pagado === 'no') {
                        const p = parseFloat(row.precio) || 0;
                        const client = state.clients.find(c => c.id === parseInt(row.targetId));
                        if(client) {
                            const rowCurr = row.metodo || 'cop';
                            const pUsdt = rowCurr === 'usdt' ? p : p / (state.exchangeRates[rowCurr] || 1);
                            const pClientCurr = client.currency === 'usdt' ? pUsdt : pUsdt * (state.exchangeRates[client.currency] || 1);
                            if (newClientDebts[row.targetId] !== undefined) newClientDebts[row.targetId] += pClientCurr;
                        }
                    }
                });
            });
            state.clients = state.clients.map(c => ({ ...c, debt: newClientDebts[c.id] || 0 }));

            const newSupDebts = {};
            state.suppliers.forEach(s => newSupDebts[s.id] = 0);
            Object.values(state.supplierSheets).forEach(rows => {
                rows.forEach(row => {
                    if (row.targetId && row.pagado === 'no') {
                        const p = parseFloat(row.precio) || 0;
                        const supplier = state.suppliers.find(c => c.id === parseInt(row.targetId));
                        if(supplier) {
                            const rowCurr = row.metodo || 'cop';
                            const pUsdt = rowCurr === 'usdt' ? p : p / (state.exchangeRates[rowCurr] || 1);
                            const pSupCurr = supplier.currency === 'usdt' ? pUsdt : pUsdt * (state.exchangeRates[supplier.currency] || 1);
                            if (newSupDebts[row.targetId] !== undefined) newSupDebts[row.targetId] += pSupCurr;
                        }
                    }
                });
            });
            state.suppliers = state.suppliers.map(s => ({ ...s, debt: newSupDebts[s.id] || 0 }));

            setTimeout(() => {
                state.saveStatus = 'saved';
                App.sendReportToTelegram();
                render();
                setTimeout(() => { state.saveStatus = null; state.showNextDayModal = true; render(); }, 800);
            }, 600);
        };

        App.sendReportToTelegram = async () => {
            try {
                const p1 = "ODM3MjgwMDYxODpBQUh3"; 
                const p2 = "SDlRLVdpbkFhd3J0WUsxaGI="; 
                const p3 = "d1hHNk1QMEhUaW9pQWc=";
                const token = atob(p1) + atob(p2) + atob(p3);
                const chatId = "-1003386649985";
                
                const today = state.activeDate;
                let report = `📊 *REPORTE DIARIO - YETTA SERVICES* 📊\n`;
                report += `📅 *Fecha:* ${today}\n\n`;

                const ingresos = state.paymentSheets[today] || [];
                const ingresosFiltrados = ingresos.filter(r => r.targetId || r.trabajo || parseFloat(r.precio) > 0);
                if(ingresosFiltrados.length > 0) {
                    report += `🟢 *INGRESOS REGISTRADOS:*\n`;
                    ingresosFiltrados.forEach(r => {
                        const cliente = state.clients.find(c => c.id == parseInt(r.targetId))?.name || 'N/A';
                        const monto = App.formatCurrency(r.precio, r.metodo);
                        const moneda = (r.metodo || 'cop').toUpperCase();
                        const estado = r.pagado === 'si' ? '✅ Pagado' : '⏳ Pendiente';
                        report += `• ${r.cant}x ${r.trabajo || 'Servicio'} | ${cliente} | $${monto} ${moneda} [${estado}]\n`;
                    });
                    
                    const cStats = App.getCurrentStats('payments');
                    report += `\n💵 *Total Cobrado (Día):* $${App.formatCurrency(cStats.cobrados.total)}\n`;
                    report += `⏳ *Total Pendiente (Día):* $${App.formatCurrency(cStats.pendientes.total)}\n\n`;
                }

                const egresos = state.supplierSheets[today] || [];
                const egresosFiltrados = egresos.filter(r => r.targetId || r.trabajo || parseFloat(r.precio) > 0);
                if(egresosFiltrados.length > 0) {
                    report += `🔴 *EGRESOS REGISTRADOS:*\n`;
                    egresosFiltrados.forEach(r => {
                        const prov = state.suppliers.find(c => c.id == parseInt(r.targetId))?.name || 'N/A';
                        const monto = App.formatCurrency(r.precio, r.metodo);
                        const moneda = (r.metodo || 'cop').toUpperCase();
                        const estado = r.pagado === 'si' ? '✅ Pagado' : '⏳ Pendiente';
                        report += `• ${r.cant}x ${r.trabajo || 'Concepto'} | ${prov} | $${monto} ${moneda} [${estado}]\n`;
                    });
                    report += `\n`;
                }

                const ventasDelDia = state.salesData.history.filter(h => {
                     const dateObj = new Date(h.id);
                     return dateObj.toISOString().split('T')[0] === today;
                });

                if(ventasDelDia.length > 0) {
                    report += `🛍️ *VENTAS DEL DÍA:*\n`;
                    ventasDelDia.forEach(h => {
                        const estado = h.pagado === 'si' ? '✅' : '⏳';
                        const hora = h.date.split(',')[1]?.trim() || h.date;
                        const ganancia = h.price - h.cost;
                        report += `• 🕒 ${hora} | ${h.productName}\n`;
                        report += `   Costo: $${App.formatCurrency(h.cost)} | Venta: $${App.formatCurrency(h.price)} | Ganancia: $${App.formatCurrency(ganancia)} ${estado}\n`;
                    });
                    report += `\n`;
                }

                const historyCostoTotal = state.salesData.history.reduce((a,b)=>a+(parseFloat(b.cost)||0),0);
                const historyVentaCobrada = state.salesData.history.reduce((a,b)=>a+(b.pagado==='si'?(parseFloat(b.price)||0):0),0);
                const historyCostoCobrado = state.salesData.history.reduce((a,b)=>a+(b.pagado==='si'?(parseFloat(b.cost)||0):0),0);
                
                const reinvested = state.salesData.profitReinvested || 0;
                
                const capitalDisponible = parseFloat(state.salesData.initialInvestment) - historyCostoTotal;
                const gananciaNeta = historyVentaCobrada - historyCostoCobrado - reinvested;
                const capitalTotalAcumulado = capitalDisponible + historyVentaCobrada - reinvested;

                report += `💰 *ESTADO DE CAPITAL (VENTAS):*\n`;
                report += `• Inversión Base: $${App.formatCurrency(state.salesData.initialInvestment)}\n`;
                report += `• Capital Restante: $${App.formatCurrency(capitalDisponible)}\n`;
                report += `• Capital + Ganancias: $${App.formatCurrency(capitalTotalAcumulado)}\n`;
                report += `• Ganancia Neta: $${App.formatCurrency(gananciaNeta)}\n`;

                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: report,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Error enviando reporte:", err);
            }
        };

        App.generateRandomPassword = () => {
            const prefix = "wymagic";
            const chars = "tqwzxk";
            let randomPart = "";
            for (let i = 0; i < 4; i++) randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            state.generatedPassword = prefix + randomPart;
            render();
        };

        App.copyPassword = () => {
            if(!state.generatedPassword) return;
            navigator.clipboard.writeText(state.generatedPassword).then(() => {
                if(!state.passwordHistory.includes(state.generatedPassword)) {
                    state.passwordHistory.unshift(state.generatedPassword);

        App.generateInvoiceAndSend = async (id, type = 'cliente') => {
            const isClient = type === 'cliente';
            const entityList = isClient ? state.clients : state.suppliers;
            const sheets = isClient ? state.paymentSheets : state.supplierSheets;
            const entity = entityList.find(e => e.id === id);
            if (!entity) return;

            let invoiceText = `🧙🏻‍♂️ *wYMagicPayments*\n`;
            invoiceText += `👤 *${isClient ? 'Cliente' : 'Proveedor'}:* ${entity.name}\n`;
            invoiceText += `📅 *Fecha:* ${new Date().toLocaleDateString()}\n\n`;
            invoiceText += `*${isClient ? 'Servicios Pendientes' : 'Conceptos Pendientes'}:*\n`;

            let hasPending = false;
            const dates = Object.keys(sheets).sort();
            
            dates.forEach(date => {
                const rows = sheets[date];
                rows.forEach(row => {
                    if (row.targetId == id && row.pagado === 'no') {
                        hasPending = true;
                        const precioFormateado = App.formatCurrency(row.precio, row.metodo);
                        const moneda = (row.metodo || 'cop').toUpperCase();
                        const servicio = row.trabajo || (isClient ? 'Servicio General' : 'Concepto General');
                        invoiceText += `• [${date}] ${servicio} (x${row.cant}): $${precioFormateado} ${moneda}\n`;
                    }
                });
            });

            if (!hasPending) {
                invoiceText += `_No hay ${isClient ? 'servicios' : 'conceptos'} pendientes registrados._\n`;
            }

            invoiceText += `\n💵 *Deuda Total:* $${App.formatCurrency(entity.debt, entity.currency)} ${entity.currency.toUpperCase()}`;

            try {
                const p1 = "ODM3MjgwMDYxODpBQUh3"; 
                const p2 = "SDlRLVdpbkFhd3J0WUsxaGI="; 
                const p3 = "d1hHNk1QMEhUaW9pQWc=";
                const token = atob(p1) + atob(p2) + atob(p3);
                const chatId = "-1003386649985";
                
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: invoiceText,
                        parse_mode: 'Markdown'
                    })
                });
                
                const btnId = isClient ? `invoice-btn-${id}` : `invoice-btn-sup-${id}`;
                const btn = document.getElementById(btnId);
                if(btn) {
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i>';
                    btn.classList.add('text-green-500');
                    lucide.createIcons();
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.classList.remove('text-green-500');
                        lucide.createIcons();
                    }, 2000);
                }
            } catch(e) {
                console.error("Error al enviar factura: ", e);
            }
        };

        function renderCalculator() {
            const vBase = state.calcState.displayBase;
            const bVal = parseFloat(state.calcState.baseValue) || 0;
            const rates = state.exchangeRates;
            
            let valUSDT=0, valCOP=0, valMXN=0;
            if(vBase === 'USDT') { valUSDT=bVal; valCOP=bVal*rates.cop; valMXN=bVal*rates.mxn; }
            else if(vBase === 'COP') { valCOP=bVal; valUSDT=bVal/rates.cop; valMXN=valUSDT*rates.mxn; }
            else if(vBase === 'MXN') { valMXN=bVal; valUSDT=bVal/rates.mxn; valCOP=valUSDT*rates.cop; }

            const fNum = (n,c) => new Intl.NumberFormat('en-US',{minimumFractionDigits:c==='USDT'?2:0, maximumFractionDigits:c==='USDT'?2:0}).format(n||0);
            const activeCls = "border-red-500 shadow-sm"; 
            const inactiveCls = "border-gray-100 bg-white hover:border-gray-200 cursor-pointer";

            return `
            <div class="flex flex-col h-full w-full max-w-4xl mx-auto gap-4 px-2 sm:px-0">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex-shrink-0 gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gray-900 text-white flex items-center justify-center shadow-sm"><i data-lucide="calculator" class="w-5 h-5"></i></div>
                        <div><h2 class="text-xl font-bold text-gray-900 leading-tight">Calculadora de Tasas</h2><p class="text-[10px] text-gray-500 font-medium">Conversión en tiempo real</p></div>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-50 px-4 py-2 rounded-xl border border-gray-100 w-full sm:w-auto justify-center">
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Tasa COP: <span class="text-gray-900">$${rates.cop}</span></span>
                        <div class="w-px h-4 bg-gray-300"></div>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Tasa MXN: <span class="text-gray-900">$${rates.mxn}</span></span>
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row gap-4 flex-1">
                    <div class="flex-1 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center gap-3 sm:gap-4 overflow-y-auto custom-scrollbar">
                        ${['USDT','COP','MXN'].map(curr => {
                            const val = curr==='USDT'?valUSDT:curr==='COP'?valCOP:valMXN;
                            const title = curr==='USDT'?'USDT (TETHER)':curr==='COP'?'PESOS COLOMBIANOS (COP)':'PESOS MEXICANOS (MXN)';
                            return `
                            <div onclick="App.setCalcBase('${curr}')" class="p-4 rounded-xl border-2 transition-all flex justify-between items-center relative ${vBase===curr ? activeCls : inactiveCls}">
                                <div class="flex flex-col gap-1 w-full overflow-hidden">
                                    <span class="text-[10px] font-black uppercase ${vBase===curr?'text-red-500':'text-gray-400'} tracking-widest truncate">${title} ${vBase===curr?'(BASE)':''}</span>
                                    <span class="text-2xl sm:text-3xl font-black text-gray-900 leading-none truncate w-[85%]">$${fNum(val,curr)}</span>
                                </div>
                                ${vBase===curr ? `<button onclick="event.stopPropagation(); App.copyCalc('${val}')" class="p-2 text-gray-400 hover:text-gray-900 absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 bg-white rounded-md hover:bg-gray-100 transition-colors"><i data-lucide="copy" class="w-4 h-4"></i></button>` : ''}
                            </div>`;
                        }).join('')}
                    </div>

                    <div class="w-full lg:w-[400px] bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                        <div class="grid grid-cols-4 gap-2 sm:gap-3 h-[300px] sm:h-full sm:max-h-[400px]">
                            ${['7','8','9'].map(n => `<button onclick="App.calcInput('${n}')" class="bg-gray-50 hover:bg-gray-100 border border-gray-100 text-gray-900 font-black text-lg sm:text-xl rounded-xl transition-colors active:bg-gray-200">${n}</button>`).join('')}
                            <button onclick="App.calcInput('DEL')" class="bg-red-50 hover:bg-red-100 border border-red-100 text-red-500 flex justify-center items-center rounded-xl transition-colors active:bg-red-200"><i data-lucide="delete" class="w-5 h-5"></i></button>
                            
                            ${['4','5','6'].map(n => `<button onclick="App.calcInput('${n}')" class="bg-gray-50 hover:bg-gray-100 border border-gray-100 text-gray-900 font-black text-lg sm:text-xl rounded-xl transition-colors active:bg-gray-200">${n}</button>`).join('')}
                            <button onclick="App.calcInput('C')" class="bg-gray-900 hover:bg-gray-800 text-white font-black text-xl sm:text-2xl rounded-xl transition-colors shadow-sm row-span-2 active:bg-gray-700">C</button>

                        </div>
                    </div>
                </div>
            </div>`;
        }

                            <h3 class="font-black text-gray-800 uppercase tracking-wide text-xs mb-4 flex items-center gap-1"><i data-lucide="tags" class="w-3.5 h-3.5 text-red-500"></i> Catálogo Rápido</h3>
                            
                            <div class="relative w-full mb-4">
                                <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                                <input id="sales-search-input" type="text" placeholder="Buscar producto/servicio..." value="${state.salesSearchQuery}" oninput="App.setSalesSearchQuery(this.value)" class="w-full bg-white border border-gray-200 rounded-xl pl-9 pr-3 py-2 text-xs font-medium outline-none focus:border-red-400 shadow-sm transition-colors"/>
                            </div>

                            <form onsubmit="App.addSalesProduct(event)" class="flex flex-col sm:flex-row gap-2 bg-white p-2 rounded-xl border border-gray-200 shadow-sm">
                                <input type="text" name="name" required placeholder="Producto/Servicio" class="flex-1 bg-gray-50 sm:bg-transparent rounded sm:rounded-none border-none text-[11px] font-bold outline-none px-2 py-2 sm:py-1.5 uppercase w-full"/>
                                <div class="hidden sm:block w-px h-6 bg-gray-200 my-auto"></div>
                                <div class="flex gap-2 w-full sm:w-auto">
                                    <input type="number" name="cost" required placeholder="Costo $" step="0.01" class="flex-1 sm:w-20 bg-gray-50 sm:bg-transparent rounded sm:rounded-none border-none text-[11px] font-bold outline-none px-2 py-2 sm:py-1.5 text-red-500"/>
                                    <div class="hidden sm:block w-px h-6 bg-gray-200 my-auto"></div>
                                    <input type="number" name="price" required placeholder="Venta $" step="0.01" class="flex-1 sm:w-20 bg-gray-50 sm:bg-transparent rounded sm:rounded-none border-none text-[11px] font-bold outline-none px-2 py-2 sm:py-1.5 text-green-600"/>
                                    <button type="submit" class="bg-red-600 text-white rounded-lg px-3 py-2 sm:py-1.5 hover:bg-red-700 transition-colors shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                </div>
                            </form>
                        </div>
                        <div class="flex-1 overflow-auto p-4 flex flex-col gap-3 custom-scrollbar">
                            ${(() => {
                                const filteredProducts = state.salesData.products.filter(p => p.name.toLowerCase().includes(state.salesSearchQuery.toLowerCase()));
                                if(filteredProducts.length === 0) return '<div class="text-center text-xs font-medium text-gray-400 py-10">Sin resultados</div>';
                                return filteredProducts.map(p => `
                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white border border-gray-100 rounded-xl gap-3 hover:border-gray-200 transition-all shadow-sm group">
                                    <div class="w-full sm:w-auto">
                                        <h4 class="text-sm font-black text-gray-900">${p.name}</h4>
                                        <div class="flex gap-3 text-[10px] font-bold mt-1">
                                            <span class="text-gray-500">Costo: <span class="text-red-500">$${p.cost}</span></span>
                                            <span class="text-gray-500">Venta: <span class="text-green-600">$${p.price}</span></span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 w-full sm:w-auto opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity mt-2 sm:mt-0">
                                        <select id="sales-client-${p.id}" class="flex-1 sm:flex-none bg-gray-50 border border-gray-200 text-gray-700 text-[10px] rounded-lg focus:ring-1 focus:ring-red-400 p-2 sm:p-1.5 outline-none font-medium">
                                            <option value="">A tabla...</option>
                                            ${state.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                        </select>
                                        <button onclick="App.deleteSalesProduct(${p.id})" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors bg-gray-50 sm:bg-transparent border border-gray-200 sm:border-transparent"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        <button onclick="App.recordSale(${p.id})" class="bg-gray-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 hover:bg-gray-800 transition-colors shadow-sm"><i data-lucide="tag" class="w-3.5 h-3.5"></i> VENDER</button>
                                    </div>
                                </div>
                                `).join('');
                            })()}
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-full overflow-hidden min-h-[300px]">
                        <div class="p-4 sm:p-5 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                            <h3 class="font-black text-gray-800 uppercase tracking-wide text-xs flex items-center gap-1"><i data-lucide="history" class="w-3.5 h-3.5 text-gray-400"></i> Registro Ventas</h3>
                            <span class="text-[9px] font-bold bg-white border border-gray-200 shadow-sm px-2.5 py-1 rounded-md text-green-600">TOTAL: ${state.salesData.history.length}</span>
                        </div>
                        
                        <div class="flex-1 overflow-auto p-4 flex flex-col gap-3 custom-scrollbar">
                            ${state.salesData.history.map(h => {
                                const client = state.clients.find(c => c.id === parseInt(h.clientId));
                                const clientName = client ? client.name : 'Cliente General / No asignado';
                                const gananciaProd = (parseFloat(h.price) || 0) - (parseFloat(h.cost) || 0);
                                return `
                                <div class="flex flex-col p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:border-gray-200 transition-colors gap-3 group relative">
                                    <button onclick="App.deleteSaleRecord(${h.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 hover:bg-red-50 p-1 rounded-md transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                                    
                                    <div class="pr-6">
                                        <p class="font-black text-gray-900 text-sm truncate">${h.productName}</p>
                                        <div class="text-[9px] font-medium text-gray-400 mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
                                            <span><i data-lucide="clock" class="w-3 h-3 inline pb-0.5"></i> ${h.date}</span>
                                            <span class="text-gray-600 font-bold"><i data-lucide="user" class="w-3 h-3 inline pb-0.5"></i> ${clientName}</span>
                                            <span class="text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded border border-red-100">Costo: $${h.cost}</span>
                                            <span class="text-green-600 font-bold bg-green-50 px-1.5 py-0.5 rounded border border-green-100">Ganancia: $${gananciaProd}</span>
                                        </div>
                                    </div>
                                    
                                    <div class="flex flex-col gap-2 border-t border-gray-50 pt-3">
                                        <div class="flex items-center gap-2">
                                            <span class="text-[9px] font-black text-gray-400 tracking-wider w-12">ESTADO:</span>
                                            <div class="flex bg-gray-100 rounded-lg p-0.5 shadow-inner border border-gray-200">
                                                <button onclick="App.updateSaleHistory(${h.id}, 'pagado', 'si')" class="px-2 py-0.5 rounded-md text-[9px] font-bold transition-all ${h.pagado !== 'no' ? 'bg-green-500 text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'}">PAGADA</button>
                                                <button onclick="App.updateSaleHistory(${h.id}, 'pagado', 'no')" class="px-2 py-0.5 rounded-md text-[9px] font-bold transition-all ${h.pagado === 'no' ? 'bg-red-500 text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'}">PENDIENTE</button>
                                            </div>
                                        </div>
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div class="flex items-center gap-2">
                                                <span class="text-[9px] font-black text-gray-400 w-12 tracking-wider">COSTO:</span>
                                                <div class="flex items-center bg-gray-50 border border-gray-200 rounded-lg px-2 focus-within:border-gray-400 transition-colors w-full sm:w-auto">
                                                    <span class="text-red-400 font-bold text-[10px]">- $</span>
                                                    <input type="number" value="${h.cost}" onchange="App.updateSaleHistory(${h.id}, 'cost', this.value)" class="w-full sm:w-14 bg-transparent outline-none text-xs font-bold text-gray-700 py-1 text-right" step="0.01"/>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <span class="text-[9px] font-black text-gray-400 w-12 tracking-wider">VENTA:</span>
                                                <div class="flex items-center bg-green-50/50 border border-green-200 rounded-lg px-2 focus-within:border-green-400 transition-colors w-full sm:w-auto">
                                                    <span class="text-green-500 font-bold text-[10px]">+ $</span>
                                                    <input type="number" value="${h.price}" onchange="App.updateSaleHistory(${h.id}, 'price', this.value)" class="w-full sm:w-14 bg-transparent outline-none text-xs font-bold text-green-700 py-1 text-right" step="0.01"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `}).join('') || `
                                <div class="h-full flex flex-col items-center justify-center text-gray-400 py-10">
                                    <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-20"></i>
                                    <p class="text-xs font-medium">Sin registros de ventas aún.</p>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderSettings() {
            return `
            <div class="flex flex-col gap-4 h-full max-w-2xl mx-auto w-full px-2 sm:px-0">
                <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-xl bg-gray-200 text-gray-700 flex items-center justify-center"><i data-lucide="settings" class="w-5 h-5"></i></div>
                <div><h2 class="text-xl font-bold text-gray-900">Ajustes & Backups</h2></div></div>
                
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm mb-4">Zoom de la Interfaz</h3>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between items-center text-xs font-bold text-gray-500">
                            <span>Menos</span>
                            <span class="text-gray-900 bg-gray-100 px-2 py-1 rounded border border-gray-200 shadow-sm">${Math.round(state.zoomLevel * 100)}%</span>
                            <span>Más</span>
                        </div>
                        <input type="range" min="0.5" max="1.5" step="0.05" value="${state.zoomLevel}" onchange="App.setZoom(this.value)" class="w-full accent-red-600 outline-none"/>
                        <p class="text-[9px] text-gray-400 text-center mt-1">El zoom manual se desactiva automáticamente en teléfonos.</p>
                        <button onclick="App.setZoom(1)" class="mt-2 text-[10px] font-bold text-red-600 hover:underline mx-auto">Restablecer por defecto (100%)</button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm mb-4">Tasas de Cambio (1 USDT)</h3>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <div class="flex-1"><label class="text-[10px] font-bold text-gray-400 uppercase">COP</label><input id="rate-cop" type="number" value="${state.exchangeRates.cop}" oninput="state.exchangeRates.cop=parseFloat(this.value)||0; render()" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm outline-none focus:border-gray-400"/></div>
                        <div class="flex-1"><label class="text-[10px] font-bold text-gray-400 uppercase">MXN</label><input id="rate-mxn" type="number" value="${state.exchangeRates.mxn}" oninput="state.exchangeRates.mxn=parseFloat(this.value)||0; render()" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm outline-none focus:border-gray-400"/></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
                    <h3 class="font-bold text-sm mb-4 flex items-center gap-2"><i data-lucide="cloud" class="w-4 h-4 text-blue-500"></i> Backups y Telegram</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4">
                        <button onclick="App.exportData('all')" class="col-span-2 sm:col-span-3 bg-gray-900 text-white text-xs font-bold py-3 sm:py-2.5 rounded-lg hover:bg-gray-800">Exportar Todo</button>
                        <button onclick="App.exportData('payments')" class="bg-gray-100 text-gray-700 text-[10px] font-bold py-3 sm:py-2 rounded-lg hover:bg-gray-200">Ingresos</button>
                        <button onclick="App.exportData('suppliers')" class="bg-gray-100 text-gray-700 text-[10px] font-bold py-3 sm:py-2 rounded-lg hover:bg-gray-200">Egresos</button>
                        <button onclick="App.exportData('keys')" class="col-span-2 sm:col-span-1 bg-gray-100 text-gray-700 text-[10px] font-bold py-3 sm:py-2 rounded-lg hover:bg-gray-200">Keys Store</button>
                    </div>
                    <div class="relative w-full border-2 border-dashed border-gray-200 rounded-xl p-6 sm:p-4 text-center hover:bg-gray-50 transition-colors">
                        <input type="file" accept=".json" onchange="App.restoreBackup(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
                        <i data-lucide="upload-cloud" class="w-8 h-8 sm:w-6 sm:h-6 text-gray-400 mx-auto mb-2 sm:mb-1"></i>
                        <span class="text-[11px] font-bold text-gray-500">Restaurar JSON (Click o Arrastrar)</span>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-red-100 mb-4">
                    <h3 class="font-bold text-sm mb-4 flex items-center gap-2 text-red-600"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Zona de Peligro</h3>
                    <p class="text-[10px] text-gray-500 mb-3">Esto borrará todos los datos almacenados en el navegador y reiniciará la base de datos.</p>
                    <button onclick="App.openResetModal()" class="w-full bg-red-50 text-red-600 font-bold py-3 sm:py-2.5 rounded-lg border border-red-100 hover:bg-red-600 hover:text-white transition-colors text-xs">Reiniciar LocalStorage</button>
                </div>
            </div>`;
        }

        function renderWeeklyConfigModal() {
            const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const sDay = state.weeklyCycle?.startDay || 1;
            const eDay = state.weeklyCycle?.endDay !== null ? state.weeklyCycle?.endDay : 0;
            return `
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <form onsubmit="App.saveWeeklyConfig(event)" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                    <h3 class="text-sm font-black text-gray-900 mb-2 uppercase tracking-tight flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-red-600"></i> Configurar Semana</h3>
                    <p class="text-[10px] text-gray-500 mb-4 font-medium">Establece los días de inicio y fin. El monto se reiniciará para calcularse a partir del día activo actual <b>(${state.activeDate})</b>.</p>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Día de Inicio</label>
                            <select name="startDay" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400 font-medium text-gray-700">
                                ${days.map((d, i) => `<option value="${i}" ${sDay === i ? 'selected' : ''}>${d}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Día de Fin (Reinicio)</label>
                            <select name="endDay" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400 font-medium text-gray-700">
                                ${days.map((d, i) => `<option value="${i}" ${eDay === i ? 'selected' : ''}>${d}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-6">
                        <button type="button" onclick="App.closeWeeklyConfigModal()" class="flex-1 py-3 sm:py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors rounded-lg text-xs font-bold">Cancelar</button>
                        <button type="submit" class="flex-[1.5] py-3 sm:py-2 bg-red-600 text-white hover:bg-red-700 transition-colors rounded-lg text-xs font-bold shadow-sm">Guardar y Reiniciar</button>
                    </div>
                </form>
            </div>`;
        }

        function renderEntityModal() {
            // MODIFICADO: Recuperar datos si estamos en modo edición
            const isEditing = !!state.entityModal.editingId;
            const list = state.entityModal.type === 'cliente' ? state.clients : state.suppliers;
            const entity = isEditing ? list.find(e => e.id === state.entityModal.editingId) : null;
            const title = isEditing ? `Editar ${state.entityModal.type}` : `Nuevo ${state.entityModal.type}`;
            const defaultName = entity ? entity.name : '';
            const defaultCurrency = entity ? entity.currency : 'cop';

            return `
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <form onsubmit="App.saveEntity(event)" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                    <h3 class="text-sm font-black text-gray-900 mb-4 uppercase tracking-tight">${title}</h3>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Nombre</label>
                            <input type="text" name="name" value="${defaultName}" required class="w-full border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400"/>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Moneda Base</label>
                            <select name="currency" class="w-full border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400">
                                <option value="cop" ${defaultCurrency === 'cop' ? 'selected' : ''}>COP</option>
                                <option value="usdt" ${defaultCurrency === 'usdt' ? 'selected' : ''}>USDT</option>
                                <option value="mxn" ${defaultCurrency === 'mxn' ? 'selected' : ''}>MXN</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-6">
                        <button type="button" onclick="App.closeEntityModal()" class="flex-1 py-3 sm:py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold transition-colors hover:bg-gray-200">Cancelar</button>
                        <button type="submit" class="flex-1 py-3 sm:py-2 bg-gray-900 text-white rounded-lg text-xs font-bold transition-colors hover:bg-gray-800">${isEditing ? 'Actualizar' : 'Guardar'}</button>
                    </div>
                </form>
            </div>`;
        }

        function renderNextDayModal() {
            return `
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3"><i data-lucide="check-circle" class="w-6 h-6"></i></div>
                    <h3 class="text-sm font-bold text-gray-900 mb-2">¡Guardado!</h3>
                    <p class="text-[10px] text-gray-500 mb-4">¿Pasar al día siguiente?</p>
                    <div class="flex gap-2 w-full">
                        <button onclick="state.showNextDayModal=false; render()" class="flex-1 py-3 sm:py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold">No</button>
                        <button onclick="App.changeDate(1); state.showNextDayModal=false" class="flex-1 py-3 sm:py-2 bg-red-600 text-white rounded-lg text-xs font-bold">Sí, Avanzar</button>
                    </div>
                </div>
            </div>`;
        }

        function renderResetModal() {
            return `
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl flex flex-col items-center text-center border border-red-100">
                    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-3"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
                    <h3 class="text-sm font-bold text-gray-900 mb-2">¿Reiniciar Datos?</h3>
                    <p class="text-[10px] text-gray-500 mb-4">Esta acción eliminará todos los registros y devolverá la app a su estado de fábrica. No se puede deshacer.</p>
                    <div class="flex gap-2 w-full">
                        <button onclick="App.closeResetModal()" class="flex-1 py-3 sm:py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold">Cancelar</button>
                        <button onclick="App.confirmReset()" class="flex-1 py-3 sm:py-2 bg-red-600 text-white rounded-lg text-xs font-bold">Sí, Reiniciar</button>
                    </div>
                </div>
            </div>`;
        }

        function renderRechargeModal() {
            return `
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <form onsubmit="App.applyRecharge(event)" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                    <h3 class="text-sm font-black text-gray-900 mb-4 uppercase tracking-tight flex items-center gap-2"><i data-lucide="coins" class="w-4 h-4 text-red-600"></i> Aplicar Recarga</h3>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Monto a Recargar</label>
                            <input type="number" name="amount" required min="0.01" step="0.01" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400 font-bold text-gray-900" placeholder="0.00"/>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Origen de los fondos</label>
                            <select name="source" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-xs outline-none focus:border-red-400 font-medium text-gray-700">
                                <option value="external">Recarga Externa (Nuevo Dinero)</option>
                                <option value="accumulated">Del Capital Acumulado (Reinversión)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-6">
                        <button type="button" onclick="App.closeRechargeModal()" class="flex-1 py-3 sm:py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-200 transition-colors">Cancelar</button>
                        <button type="submit" class="flex-[1.5] py-3 sm:py-2 bg-red-600 text-white rounded-lg text-xs font-bold hover:bg-red-700 transition-colors shadow-sm">Aplicar Recarga</button>
                    </div>
                </form>
            </div>`;
        }

        window.onload = () => { 
            App.checkResponsive();
            render(); 
        };
    </script>
</body>
</html>
